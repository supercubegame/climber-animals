<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Climber Animals: Together — v2.1</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1b2a;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#fff;
    -webkit-user-select:none;user-select:none;cursor:default}
  #view{display:block;width:100vw;height:100vh}
  .panel{position:fixed;background:rgba(18,32,45,.62);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px 16px;
    box-shadow:0 8px 28px rgba(0,0,0,.28)}
  #hud{top:16px;left:16px;min-width:176px}
  #hud .big{font-size:34px;font-weight:700;line-height:1.05;letter-spacing:-.5px}
  #hud .big span{font-size:15px;font-weight:500;opacity:.65;margin-left:3px}
  #hud .row{display:flex;justify-content:space-between;font-size:13px;opacity:.82;margin-top:5px}
  #bar{height:7px;border-radius:4px;background:rgba(255,255,255,.16);margin-top:10px;overflow:hidden}
  #barfill{height:100%;width:0%;border-radius:4px;
    background:linear-gradient(90deg,#8fd66b,#ffd166,#ff8fab);transition:width .12s linear}
  #picker{top:16px;right:16px;text-align:right}
  #picker .t{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;opacity:.6;margin-bottom:7px}
  .sp{display:inline-block;padding:5px 11px;margin:2px;border-radius:9px;font-size:13px;
    background:rgba(255,255,255,.1);border:1px solid transparent;cursor:pointer}
  .sp.on{background:rgba(255,255,255,.92);color:#16232f;font-weight:700;border-color:#fff}
  #keys{bottom:16px;left:16px;font-size:12.5px;line-height:1.75;opacity:.9;max-width:290px}
  #keys b{display:inline-block;min-width:62px;font-family:Consolas,monospace;
    background:rgba(255,255,255,.14);border-radius:5px;padding:0 6px;margin-right:8px;font-weight:600}
  #banner{left:50%;top:34%;transform:translate(-50%,-50%);text-align:center;display:none;padding:24px 40px}
  #banner .h{font-size:40px;font-weight:800;margin-bottom:6px}
  #toast{left:50%;bottom:26px;transform:translateX(-50%);font-size:14px;
    padding:8px 18px;opacity:0;transition:opacity .35s}
  #lock{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
    padding:16px 26px;cursor:pointer;transition:opacity .25s}
  #lock.hidden{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" class="panel">
  <div class="big"><span id="h-cur">0.0</span><span>m</span></div>
  <div class="row"><span>最高</span><span><b id="h-best">0.0</b> m</span></div>
  <div class="row"><span>掉落</span><span><b id="h-falls">0</b> 次</span></div>
  <div class="row"><span>塔顶</span><span><b id="h-top">0</b> m</span></div>
  <div id="bar"><div id="barfill"></div></div>
</div>

<div id="picker" class="panel">
  <div class="t">Pick your climber</div>
  <div id="splist"></div>
</div>

<div id="keys" class="panel">
  <div><b>W A S D</b>移动（跟着镜头方向）</div>
  <div><b>Space</b>跳（只有落地时能跳）</div>
  <div><b>移动鼠标</b>转视角（点一下画面先锁定）</div>
  <div><b>Q E</b>左右转 &nbsp;<b>滚轮</b>拉远拉近</div>
  <div><b>1 2 3 4</b>换动物（牛/鸡/羊/猪）</div>
  <div><b>R</b>回农场重来（最高记录保留）</div>
  <div style="opacity:.62;margin-top:6px">没有存档点。掉下去就得重爬。<br>草地无限延伸，可以随便走远。</div>
</div>

<div id="lock" class="panel">
  <div style="font-size:15px;font-weight:700;margin-bottom:2px">点一下画面，鼠标就能直接转视角</div>
  <div style="opacity:.7;font-size:12.5px">锁定后移动鼠标即可环视，按 Esc 解除</div>
</div>

<div id="banner" class="panel">
  <div class="h">🏆 登顶！</div>
  <div id="bansub"></div>
</div>
<div id="toast" class="panel"></div>

<script>
"use strict";
/* ============================================================================
 * PURE CORE - inlined verbatim from src/core/ by tools/build.mjs.
 * DO NOT EDIT BELOW THIS LINE. Edit src/core/*.mjs and run `node tools/build.mjs`.
 * The fast gate rebuilds and byte-compares, so an edit here turns CI red.
 * ==========================================================================*/
/* @INLINE:CORE */
/* ============================================================================
 * END PURE CORE. Everything below is shell: rendering, input, HUD. No physics.
 * ==========================================================================*/

var BUILD_VERSION = "2.1.0";

// ---------------------------------------------------------------- state
var level = makeLevel(DEFAULT_SEED);
var player = makePlayer(level, "cow");
var speciesId = "cow";
var camYaw = 0.6, camPitch = CAM_PITCH_DEFAULT, camDist = CAM_DIST_DEFAULT;
var pointerLocked = false;
// Visual-only animal state. Facing is smoothed toward the direction of travel so
// the animal turns instead of snapping, and it is NOT physics: the collision box
// is a circle of PLAYER_R whatever way the model points.
var facing = 0.6, squash = 0, prevOnGround = true, prevVy = 0;
var keys = Object.create(null);
var consoleErrors = [];
var acc = 0, last = 0, tickCount = 0, fps = 0, fpsAcc = 0, fpsN = 0;

var cv = document.getElementById("view");
var ctx = cv.getContext("2d");
var W = 0, H = 0, DPR = 1;
var view = null;   // built once per frame by the pure core

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(320, window.innerWidth);
  H = Math.max(240, window.innerHeight);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width = W + "px";
  cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// The shell owns NO camera maths. makeView / projectPoint live in the pure core
// so the fast gate can assert where things land on screen; v1.0 kept them here,
// where nothing could test them, and shipped inverted pitch signs that threw the
// animal 83px below the bottom edge. See docs/PITFALLS.md.
// Framing scales with the animal, so a chicken is not a speck and a cow does not
// fill the frame. camDist is still yours to change with the wheel; this only moves
// the DEFAULT and the aim height.
function animalHeight() {
  return animalParts(speciesDef(speciesId), makePose(0, 0, 0, 0)).height;
}
function updateCamera() {
  // Apparent size should be roughly constant across species, so distance tracks
  // the model height. Not strictly proportional: fully proportional put the
  // chicken camera at 6.6 units, close enough to clip through scenery, and it also
  // erases the fact that a cow IS bigger. 0.30 + 0.68*h keeps a cow at ~11 and a
  // chicken at ~7 while both still fill a similar slice of the frame.
  var h = animalHeight();
  view = makeView(player.x, player.y, player.z, camYaw, camPitch,
    camDist * (0.30 + 0.68 * h), W, H, h * 0.70);
}
function toCam(px, py, pz, out) {
  return toCameraSpace(px, py, pz, view.eye, view.yaw, view.pitch, out);
}
function project(px, py, pz, out) {
  return projectPoint(px, py, pz, view, out);
}

// ---------------------------------------------------------------- colours
function shade(hex, f) {
  var n = parseInt(hex.slice(1), 16);
  var r = Math.min(255, Math.round(((n >> 16) & 255) * f));
  var g = Math.min(255, Math.round(((n >> 8) & 255) * f));
  var b = Math.min(255, Math.round((n & 255) * f));
  return "rgb(" + r + "," + g + "," + b + ")";
}
// Blend toward the horizon colour so distance reads. t = 0 is untouched.
function hazed(hex, f, t) {
  var n = parseInt(hex.slice(1), 16);
  var mix = function (c) { return Math.min(255, Math.round(c * f * (1 - t) + 196 * t)); };
  return "rgb(" + mix((n >> 16) & 255) + "," + mix((n >> 8) & 255) + "," + mix(n & 255) + ")";
}

// ---------------------------------------------------------------- box drawing
// All geometry (corners, back-face culling, near-plane clipping, projection) is
// in the pure core so the gate can assert what reaches the screen. The shell only
// picks colours and fills paths.
function drawBox(x, y, z, w, h, d, color, alpha, haze) {
  var faces = boxScreenFaces(x, y, z, w, h, d, view);
  if (faces.length === 0) return;
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  for (var f = 0; f < faces.length; f++) {
    var pts = faces[f].pts;
    ctx.fillStyle = haze ? hazed(color, faces[f].lit, haze) : shade(color, faces[f].lit);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- sky
function drawSky() {
  var t = Math.max(0, Math.min(1, player.y / Math.max(1, level.topY)));
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mixHex("#4a7fc1", "#241a48", t));
  g.addColorStop(0.55, mixHex("#a8d3ef", "#5b4a8f", t));
  g.addColorStop(1, mixHex("#e8f2d8", "#b98fb0", t));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // sun, parallaxed by yaw so turning the camera reads as turning
  var sx = (W * 0.5) + Math.sin(view.yaw - 2.1) * W * 0.62;
  var sy = H * (0.20 + t * 0.1);
  var sg = ctx.createRadialGradient(sx, sy, 6, sx, sy, 120);
  sg.addColorStop(0, "rgba(255,247,214,.95)");
  sg.addColorStop(1, "rgba(255,247,214,0)");
  ctx.fillStyle = sg;
  ctx.fillRect(sx - 130, sy - 130, 260, 260);
}
function mixHex(a, b, t) {
  var na = parseInt(a.slice(1), 16), nb = parseInt(b.slice(1), 16);
  var r = Math.round(((na>>16)&255) * (1-t) + ((nb>>16)&255) * t);
  var g = Math.round(((na>>8)&255) * (1-t) + ((nb>>8)&255) * t);
  var c = Math.round((na&255) * (1-t) + (nb&255) * t);
  return "rgb(" + r + "," + g + "," + c + ")";
}

// ---------------------------------------------------------------- animal
function speciesDef(id) { return speciesById(id); }

// Walk cycle phase comes from DISTANCE WALKED, not elapsed time, so the legs
// never skate when you change speed or stop mid-stride. player.dist is core state,
// which is also why a replay animates identically.
var STRIDE = 1.35;
function currentPose() {
  var speed = Math.hypot(player.vx, player.vz);
  var speed01 = Math.min(1, speed / MOVE_SPEED);
  var gait = (player.dist / STRIDE) % 1;
  return makePose(gait, speed01, player.onGround ? 0 : 1, squash);
}

function drawAnimal() {
  var sp = speciesDef(speciesId);
  var model = animalParts(sp, currentPose());
  var frame = makeFrame(player.x, player.y, player.z, facing);
  var parts = model.parts;

  // Sort the parts back to front in camera space. Without this, a snout drawn
  // before the head it sits on top of disappears into it from some angles.
  var ordered = [];
  var probe = [0, 0, 0];
  for (var i = 0; i < parts.length; i++) {
    var pt = parts[i];
    localToWorld(frame, pt.x, pt.y - pt.h / 2, pt.z, probe);
    toCam(probe[0], probe[1], probe[2], _s);
    ordered.push([_s[2], pt]);
  }
  ordered.sort(function (a, b) { return b[0] - a[0]; });

  for (var j = 0; j < ordered.length; j++) {
    var q = ordered[j][1];
    var faces = localBoxScreenFaces(q.x, q.y, q.z, q.w, q.h, q.d, frame, view);
    for (var f = 0; f < faces.length; f++) {
      var pts = faces[f].pts;
      ctx.fillStyle = shade(q.color, faces[f].lit);
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (var k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
      ctx.closePath();
      ctx.fill();
    }
  }

  // eyes last, in local space so they ride the head when the animal turns
  var e = [0, 0, 0], w2 = [0, 0, 0];
  for (var side = -1; side <= 1; side += 2) {
    localToWorld(frame, side * model.eye.x, model.eye.y, model.eye.z, w2);
    if (!project(w2[0], w2[1], w2[2], e)) continue;
    var r = Math.max(1.1, 22 / e[2]);
    ctx.fillStyle = "#20191a";
    ctx.beginPath(); ctx.arc(e[0], e[1], r, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(e[0] - r * 0.3, e[1] - r * 0.3, r * 0.36, 0, 6.2832); ctx.fill();
  }
}

// Facing, squash and stretch. Squash is driven by the LANDING IMPACT (the vy we
// had on the frame before touching down), so a small hop gives a small squish and
// a long fall gives a real thud.
function updateAnimalVisuals(dt) {
  var speed = Math.hypot(player.vx, player.vz);
  if (speed > 0.35) {
    var want = Math.atan2(player.vx, player.vz);
    var d = want - facing;
    while (d > Math.PI) d -= 6.2831853;
    while (d < -Math.PI) d += 6.2831853;
    facing += d * Math.min(1, dt * 11);
  }
  if (player.onGround && !prevOnGround) {
    squash = Math.min(1, Math.abs(prevVy) / 18);
  } else if (!player.onGround) {
    squash = -Math.min(0.5, Math.max(0, player.vy) / 26);   // stretch on the way up
  }
  squash += (0 - squash) * Math.min(1, dt * 9);
  prevOnGround = player.onGround;
  prevVy = player.vy;
}

// Landing shadow: the highest platform top strictly below the player. Purely
// cosmetic, but it is what makes an air jump judgeable at all.
function drawShadow() {
  var bestP = null;
  for (var i = 0; i < level.platforms.length; i++) {
    var p = level.platforms[i];
    if (p.y > player.y - 0.02) continue;
    if (Math.abs(player.x - p.x) > p.w / 2 || Math.abs(player.z - p.z) > p.d / 2) continue;
    if (!bestP || p.y > bestP.y) bestP = p;
  }
  if (!bestP) return;
  var c = [0,0,0];
  if (!project(player.x, bestP.y + 0.02, player.z, c)) return;
  var drop = player.y - bestP.y;
  var rad = Math.max(3, (view.focal / c[2]) * 0.36);
  ctx.globalAlpha = Math.max(0.08, 0.34 - drop * 0.02);
  ctx.fillStyle = "#14202b";
  ctx.beginPath(); ctx.ellipse(c[0], c[1], rad, rad * 0.45, 0, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- frame
var order = [];
// The shell's own scratch vector. Do NOT reuse the core's `_v`: that only happens
// to be reachable because the build inlines the core into this file, and it is the
// same buffer projectPoint writes into. Borrowing it would work today and break
// silently the moment anything projects between the write and the read.
var _s = [0, 0, 0];
function collect(list, isDecor) {
  for (var i = 0; i < list.length; i++) {
    var p = list[i];
    if (p.infinite) continue;      // drawGround() owns the ground plane
    if (Math.abs(p.y - player.y) > 62) continue;
    toCam(p.x, p.y, p.z, _s);
    if (_s[2] < 0.4 || _s[2] > 120) continue;
    order.push([_s[2], p, isDecor]);
  }
}
// The ground is an infinite plane in the physics, so it has to LOOK infinite too.
// A slab centred on the player does that, and a checker of slightly darker tiles
// SNAPPED TO THE WORLD GRID is what makes movement readable -- a plain slab that
// follows you looks like standing still. Snapping matters: tile the grid to the
// player instead and the pattern swims, which reads as motion sickness.
var GROUND_TILE = 9;
var GROUND_SPAN = 7;          // tiles each way from the player
// Concentric slabs, largest first, each hazier than the last. One giant slab gets
// ONE flat colour, so at 36m up the frame was a single sheet of green with no
// perspective cue at all -- it read as a void, and the tower looked like it was
// lying on the grass. Rings give the horizon a gradient without per-vertex shading,
// which flat-filled polygons cannot do.
var GROUND_RINGS = [[1600, 0.62], [700, 0.46], [300, 0.30], [120, 0.15]];
function drawGround() {
  var g = level.platforms[0];
  var cx = Math.round(player.x / GROUND_TILE) * GROUND_TILE;
  var cz = Math.round(player.z / GROUND_TILE) * GROUND_TILE;
  for (var r = 0; r < GROUND_RINGS.length; r++) {
    drawBox(cx, g.y, cz, GROUND_RINGS[r][0], g.h, GROUND_RINGS[r][0], g.color, 1, GROUND_RINGS[r][1]);
  }
  // The checker is the motion and altitude cue, so it must never vanish entirely:
  // fading it to nothing was what left the high-altitude frame featureless. Instead
  // the tiles GROW with height (9 units near the ground, up to ~34 high up) so the
  // grid stays legible at any distance while the lines still converge.
  var alt = Math.max(0, player.y);
  var tile = GROUND_TILE * (1 + Math.min(2.8, alt / 26));
  var fade = 1 - Math.min(0.6, alt / 120);
  cx = Math.round(player.x / tile) * tile;
  cz = Math.round(player.z / tile) * tile;
  for (var i = -GROUND_SPAN; i <= GROUND_SPAN; i++) {
    for (var j = -GROUND_SPAN; j <= GROUND_SPAN; j++) {
      var tx = cx + i * tile, tz = cz + j * tile;
      var gi = Math.round(tx / tile), gj = Math.round(tz / tile);
      if (((gi + gj) & 1) === 0) continue;                       // half the cells
      var dd = Math.hypot(tx - player.x, tz - player.z);
      if (dd > tile * (GROUND_SPAN + 0.5)) continue;
      drawBox(tx, g.y + 0.012, tz, tile, 0.012, tile, "#82bd5a",
        fade, Math.min(0.5, dd / (tile * 13)));
    }
  }
}

// Clouds drift with player.t, which is CORE state, so the sky animates and stays
// deterministic. Date.now() here would have broken every replay assertion.
function drawClouds() {
  for (var i = 0; i < level.clouds.length; i++) {
    var c = level.clouds[i];
    var x = cloudX(c, player.t) + Math.round(player.x / CLOUD_WRAP) * CLOUD_WRAP;
    if (Math.abs(c.y - player.y) > 150) continue;
    var dz = c.z - player.z, dx = x - player.x;
    if (Math.hypot(dx, dz) > 260) continue;
    drawBox(x, c.y, c.z, c.w, c.h, c.d, "#ffffff", 0.82, 0.16);
    for (var k = 0; k < c.puffs; k++) {
      var f = (k + 1) / (c.puffs + 1);
      drawBox(x + (f - 0.5) * c.w * 0.9, c.y + c.h * 0.62, c.z + (k % 2 ? 0.3 : -0.3) * c.d,
        c.w * 0.42, c.h * 0.8, c.d * 0.62, "#ffffff", 0.72, 0.16);
    }
  }
}

// Chimney smoke: puffs on a loop, each rising and swelling and fading. Anchored to
// the chimney box the level generator placed, so the two cannot drift apart.
var SMOKE_PUFFS = 7;
var SMOKE_PERIOD = 3.4;
function drawSmoke() {
  var ch = level.chimney;
  if (!ch) return;
  if (Math.hypot(ch.x - player.x, ch.z - player.z) > 90 || player.y > 60) return;
  for (var i = 0; i < SMOKE_PUFFS; i++) {
    var age = ((player.t / SMOKE_PERIOD) + i / SMOKE_PUFFS) % 1;
    var rise = age * 7.5;
    var size = 0.5 + age * 1.9;
    var fade = 0.5 * (1 - age) * (1 - age);
    if (fade < 0.02) continue;
    drawBox(ch.x + Math.sin(age * 5 + i) * age * 1.4, ch.top + rise,
      ch.z + Math.cos(age * 4 + i) * age * 1.1,
      size, size * 0.75, size, "#e8e4dd", fade, 0.1);
  }
}

function render() {
  drawSky();
  drawClouds();
  drawGround();
  drawSmoke();
  order.length = 0;
  collect(level.decor, true);
  collect(level.platforms, false);
  order.sort(function (a, b) { return b[0] - a[0]; });   // painter: far to near
  for (var j = 0; j < order.length; j++) {
    var q = order[j][1], dec = order[j][2], z = order[j][0];
    // Aerial haze on far geometry. Cheap, and it is what lets you read which of
    // two overlapping platforms is nearer.
    var haze = Math.min(0.55, Math.max(0, (z - 34) / 90));
    drawBox(q.x, q.y, q.z, q.w, q.h, q.d, q.color, q.kind === "cloud" ? 0.9 : 1, haze);
    if (!dec && q.label) drawLabel(q);
  }
  drawNextMarker();
  drawShadow();
  drawAnimal();
}

// A soft beacon over the platform you are meant to reach next. Without it the
// spiral hides the route behind you and the game reads as unfair rather than hard.
function drawNextMarker() {
  var n = level.platforms[Math.min(player.groundIdx + 1, level.platforms.length - 1)];
  if (!n || n.i === player.groundIdx) return;
  var pulse = 0.55 + 0.45 * Math.sin(player.t * 3.4);
  var a = [0, 0, 0], b = [0, 0, 0];
  if (!project(n.x, n.y + 0.05, n.z, a) || !project(n.x, n.y + 1.5, n.z, b)) return;
  if (a[2] > 60) return;
  var fade = Math.max(0, 1 - a[2] / 60);
  ctx.globalAlpha = 0.30 * fade * pulse;
  ctx.strokeStyle = "#fff8c4";
  ctx.lineWidth = Math.max(2, 26 / a[2]);
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  ctx.globalAlpha = 0.55 * fade * pulse;
  var r = Math.max(4, (view.focal / a[2]) * (Math.min(n.w, n.d) * 0.42));
  ctx.beginPath(); ctx.ellipse(a[0], a[1], r, r * 0.42, 0, 0, 6.2832); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawLabel(p) {
  var c = [0,0,0];
  if (!project(p.x, p.y + 0.75, p.z, c)) return;
  if (c[2] > 46) return;
  ctx.globalAlpha = Math.max(0, 1 - c[2] / 46);
  ctx.font = "600 12px Consolas, monospace";
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(12,20,28,.55)";
  var tw = ctx.measureText(p.label).width;
  ctx.fillRect(c[0] - tw / 2 - 6, c[1] - 13, tw + 12, 18);
  ctx.fillStyle = "#fff";
  ctx.fillText(p.label, c[0], c[1]);
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- input
function currentInput() {
  var f = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
  var r = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
  var sy = Math.sin(camYaw), cyw = Math.cos(camYaw);
  return { mx: f * sy + r * cyw, mz: f * cyw - r * sy, jump: !!keys.space };
}
var MAP = { KeyW:"w", KeyA:"a", KeyS:"s", KeyD:"d", ArrowUp:"w", ArrowLeft:"a",
  ArrowDown:"s", ArrowRight:"d", Space:"space", KeyQ:"q", KeyE:"e" };
window.addEventListener("keydown", function (e) {
  if (MAP[e.code]) { keys[MAP[e.code]] = true; e.preventDefault(); }
  if (e.code === "KeyR") resetRun();
  // Map by the species' OWN declared key, not by roster index: the roster was
  // reordered for the model file and index-based keys silently remapped 2 and 3.
  var want = { Digit1: "1", Digit2: "2", Digit3: "3", Digit4: "4" }[e.code];
  if (want) {
    for (var si = 0; si < SPECIES.length; si++) {
      if (SPECIES[si].key === want) { setSpecies(SPECIES[si].id); break; }
    }
  }
});
window.addEventListener("keyup", function (e) { if (MAP[e.code]) keys[MAP[e.code]] = false; });
// --- mouse look ---------------------------------------------------------------
// Pointer Lock, because that is the only way a browser gives you continuous mouse
// look: without it a page only sees the cursor while a button is held, which is
// why v1.0 needed drag-to-turn. The lock request MUST come from a real user
// gesture, so a click on the canvas arms it. Drag still works as a fallback for
// anyone who does not want their cursor captured.
var elLock = document.getElementById("lock");
var dragging = false, lastMX = 0, lastMY = 0;

// Mouse right must pan the view RIGHT. v2.0 subtracted here and felt inverted,
// while Q/E (which subtract for LEFT) were correct -- the two paths disagreeing is
// the tell. Increasing yaw swings the view toward its own right vector; the
// derivation is in camera.mjs and `camera:mouse-yaw-sign` checks it by projecting a
// probe point rather than trusting either comment.
function look(dxp, dyp) {
  camYaw += dxp * YAW_PER_PIXEL;
  camPitch = clampPitch(camPitch + dyp * PITCH_PER_PIXEL);
}
function requestLock() {
  if (pointerLocked) return;
  try {
    var r = cv.requestPointerLock && cv.requestPointerLock();
    if (r && typeof r.catch === "function") r.catch(function () {});
  } catch (e) { /* unsupported: drag-to-look still works */ }
}
document.addEventListener("pointerlockchange", function () {
  pointerLocked = document.pointerLockElement === cv;
  elLock.className = pointerLocked ? "panel hidden" : "panel";
});
document.addEventListener("pointerlockerror", function () {
  pointerLocked = false;
  elLock.className = "panel";
});
cv.addEventListener("click", requestLock);
elLock.addEventListener("click", requestLock);

cv.addEventListener("mousedown", function (e) {
  if (!pointerLocked) { dragging = true; lastMX = e.clientX; lastMY = e.clientY; }
});
window.addEventListener("mouseup", function () { dragging = false; });
window.addEventListener("mousemove", function (e) {
  if (pointerLocked) {
    look(e.movementX || 0, e.movementY || 0);
  } else if (dragging) {
    look(e.clientX - lastMX, e.clientY - lastMY);
    lastMX = e.clientX; lastMY = e.clientY;
  }
});
window.addEventListener("wheel", function (e) {
  camDist = clampDist(camDist + Math.sign(e.deltaY) * 0.6);
}, { passive: true });

function resetRun() {
  var best = player.bestY, falls = player.falls;
  player = makePlayer(level, speciesId);
  player.bestY = best; player.falls = falls;
  toast("回到农场了，最高记录留着");
}
function setSpecies(id) {
  speciesId = id;
  player = Object.assign({}, player, { speciesId: id });
  paintPicker();
  toast("换成 " + speciesDef(id).name);
}

// ---------------------------------------------------------------- HUD
var elCur = document.getElementById("h-cur"), elBest = document.getElementById("h-best");
var elFalls = document.getElementById("h-falls"), elTop = document.getElementById("h-top");
var elFill = document.getElementById("barfill"), elBanner = document.getElementById("banner");
var elBanSub = document.getElementById("bansub"), elToast = document.getElementById("toast");
elTop.textContent = level.topY.toFixed(0);
var toastT = 0;
function toast(msg) { elToast.textContent = msg; elToast.style.opacity = "1"; toastT = 1.9; }
function paintPicker() {
  var h = "";
  for (var i = 0; i < SPECIES.length; i++) {
    h += '<span class="sp' + (SPECIES[i].id === speciesId ? " on" : "") + '" data-id="' +
      SPECIES[i].id + '">' + SPECIES[i].key + " " + SPECIES[i].name + "</span>";
  }
  document.getElementById("splist").innerHTML = h;
}
document.getElementById("splist").addEventListener("click", function (e) {
  var id = e.target && e.target.getAttribute && e.target.getAttribute("data-id");
  if (id) setSpecies(id);
});
paintPicker();
function paintHUD() {
  elCur.textContent = player.y.toFixed(1);
  elBest.textContent = player.bestY.toFixed(1);
  elFalls.textContent = String(player.falls);
  elFill.style.width = Math.max(0, Math.min(100, (player.bestY / level.topY) * 100)).toFixed(1) + "%";
  if (player.won && elBanner.style.display !== "block") {
    elBanner.style.display = "block";
    elBanSub.textContent = "用了 " + player.t.toFixed(0) + " 秒，掉了 " + player.falls + " 次";
  }
}

// Tell the player what a mistake cost. The metres come from player.lastDrop, which
// the CORE sets on the landing step -- the shell used to recompute it from its own
// takeoff bookkeeping, which is a second source of truth for the same fact.
function reportFalls() {
  if (player.lastDrop > 0) toast("掉了 " + player.lastDrop.toFixed(1) + " m");
}

// ---------------------------------------------------------------- loop
function frame(now) {
  if (!last) last = now;
  var dt = (now - last) / 1000;
  last = now;
  // A backgrounded tab throttles rAF; without this clamp the first frame back
  // would teleport the animal through the tower.
  if (dt > MAX_SUBSTEPS * FIXED_DT) dt = MAX_SUBSTEPS * FIXED_DT;
  if (dt > 0) { fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; } }
  acc += dt;
  var guard = 0;
  var input = currentInput();
  while (acc >= FIXED_DT && guard < MAX_SUBSTEPS) {
    player = stepPlayer(player, input, level);
    acc -= FIXED_DT; guard++; tickCount++;
  }
  if (acc > FIXED_DT * MAX_SUBSTEPS) acc = 0;
  // Q/E share the mouse's sign convention: E (right) ADDS, exactly like a
  // rightward pointer delta. Keeping the two paths expressed in the same terms is
  // what stops them drifting apart the way they did in v2.0.
  var KEY_TURN = 1.9;
  if (keys.q) camYaw -= KEY_TURN * dt;
  if (keys.e) camYaw += KEY_TURN * dt;
  reportFalls();
  updateAnimalVisuals(dt);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) elToast.style.opacity = "0"; }
  updateCamera();
  render();
  paintHUD();
  requestAnimationFrame(frame);
}
window.addEventListener("error", function (e) { consoleErrors.push(String(e.message)); });

// Read-only handle for tools/verify-browser.mjs. The browser gate drives the
// game through REAL KeyboardEvents and only reads state through here, so the
// input path is under test rather than mocked out.
//
// nav() hands out RAW NUMBERS ONLY. The steering maths lives in the gate, not in
// here: a helper that computed "which way should I go" inside the page would be
// shipped code that only the test uses, and the test would then be grading the
// helper instead of the game.
window.__game = {
  version: BUILD_VERSION,
  get state() { return player; },
  get ticks() { return tickCount; },
  get fps() { return fps; },
  get errors() { return consoleErrors.slice(); },
  get camYaw() { return camYaw; },
  get camPitch() { return camPitch; },
  get camDist() { return camDist; },
  get pointerLocked() { return pointerLocked; },
  level: {
    seed: level.seed, count: level.platforms.length,
    topY: level.topY, decorCount: level.decor.length,
    groundW: level.platforms[0].w, groundD: level.platforms[0].d
  },
  nav: function () {
    var i = player.groundIdx;
    var cur = level.platforms[i] || null;
    var nxt = level.platforms[Math.min(i + 1, level.platforms.length - 1)] || null;
    return {
      idx: i, onGround: player.onGround, camYaw: camYaw, camPitch: camPitch,
      px: player.x, py: player.y, pz: player.z, bestY: player.bestY, falls: player.falls,
      cur: cur ? { x: cur.x, y: cur.y, z: cur.z, w: cur.w, d: cur.d } : null,
      next: nxt ? { x: nxt.x, y: nxt.y, z: nxt.z, w: nxt.w, d: nxt.d } : null
    };
  },
  // Where the animal's head projects to right now, in CSS pixels. The browser
  // gate asserts this sits inside the viewport: that is the check v1.0 lacked.
  aimPixel: function () {
    var o = [0, 0, 0];
    return projectPoint(view.target.x, view.target.y, view.target.z, view, o)
      ? { x: o[0], y: o[1], z: o[2], w: W, h: H } : null;
  }
};

updateCamera();
requestAnimationFrame(frame);
</script>
</body>
</html>
