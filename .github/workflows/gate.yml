name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast gate (pure core)
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.gate.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - id: gate
        continue-on-error: true
        run: node tools/verify.mjs --log=fast-gate.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-fast
          path: fast-gate.log
          if-no-files-found: warn

  rebuild:
    name: rebuild the shipped file if stale
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - id: rebuild
        run: |
          node tools/build.mjs
          if git diff --quiet -- climber-animals.html; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.rebuild.outputs.stale == 'true'
        run: |
          git config user.name "climber-animals-bot"
          git config user.email "climber-animals-bot@users.noreply.github.com"
          git add climber-animals.html
          git commit -m "build: regenerate climber-animals.html from src [ci rebuild]"
          git push

  browser:
    name: slow gate (headless Chromium)
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.gate.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: install puppeteer
        run: npm i --no-audit --no-fund --no-save puppeteer@23
      - id: gate
        continue-on-error: true
        run: node tools/verify-browser-v4.mjs --log=browser-gate.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-browser
          path: |
            browser-gate.log
            shots/*.png
          if-no-files-found: warn

  report:
    name: write results back
    needs: [fast, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { path: logs, merge-multiple: true }
      - uses: actions/github-script@v7
        env:
          FAST: ${{ needs.fast.outputs.result }}
          BROWSER: ${{ needs.browser.outputs.result }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- climber-animals-gate -->';
            const sha = context.sha;
            const runId = context.runId;
            const fast = process.env.FAST || 'unknown';
            const browser = process.env.BROWSER || 'unknown';
            const grab = (f) => { try { return fs.readFileSync('logs/' + f, 'utf8'); } catch { return ''; } };
            const failures = (t) => t.split('\n').filter((l) => l.startsWith('[FAIL]')).join('\n');
            const body = `${MARKER}\n### V4 gate · ${sha.slice(0, 7)} · run [${runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId})\n\n| gate | result |\n|---|---|\n| fast (pure core) | ${fast} |\n| slow (headless Chromium) | ${browser} |\n\n${failures(grab('fast-gate.log'))}\n${failures(grab('browser-gate.log'))}`;
            const { owner, repo } = context.repo;
            const upsert = async (items, create, update) => { const old = items.find((c) => c.body && c.body.includes(MARKER)); if (old) await update(old.id); else await create(); };
            let pr = context.payload.pull_request && context.payload.pull_request.number;
            if (!pr) { const r = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha }); if (r.data.length) pr = r.data[0].number; }
            if (pr) { const r = await github.rest.issues.listComments({ owner, repo, issue_number: pr, per_page: 100 }); await upsert(r.data, () => github.rest.issues.createComment({ owner, repo, issue_number: pr, body }), (id) => github.rest.issues.updateComment({ owner, repo, comment_id: id, body })); }
            const c = await github.rest.repos.listCommentsForCommit({ owner, repo, commit_sha: sha, per_page: 100 });
            await upsert(c.data, () => github.rest.repos.createCommitComment({ owner, repo, commit_sha: sha, body }), (id) => github.rest.repos.updateCommitComment({ owner, repo, comment_id: id, body }));
            if (fast !== 'success' || browser !== 'success') core.setFailed(`gate failed (fast=${fast}, browser=${browser})`);

  attest:
    name: confirm the report actually landed
    needs: [report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- climber-animals-gate -->';
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const runId = String(context.runId);
            const r = await github.rest.repos.listCommentsForCommit({ owner, repo, commit_sha: sha, per_page: 100 });
            const found = r.data.filter((c) => c.body && c.body.includes(MARKER));
            if (!found.length) core.setFailed('no commit comment for this run: gate result was not delivered');
            else core.info(`report found for ${sha.slice(0, 7)}; ${found.length} marked comment(s)`);
